name: MyWorkTracker
options:
  bundleIdPrefix: com.zzanggi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  MyWorkTracker:
    type: application
    platform: macOS
    sources:
      - path: MyWorkTracker
    settings:
      base:
        PRODUCT_NAME: Crumble              # 사용자에게 보이는 앱 이름(번들 ID는 유지 → 데이터 보존)
        PRODUCT_BUNDLE_IDENTIFIER: com.zzanggi.MyWorkTracker
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        DEAD_CODE_STRIPPING: YES

  MyWorkTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MyWorkTrackerTests
      - path: MyWorkTracker/SessionMath.swift   # 순수 로직만 컴파일(호스트 앱 불필요)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzanggi.MyWorkTrackerTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  MyWorkTracker:
    build:
      targets:
        MyWorkTracker: all
        MyWorkTrackerTests: [test]
    test:
      targets:
        - MyWorkTrackerTests
